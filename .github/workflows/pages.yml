# Сайт реестра на mdBook (решение 21): собирается из закоммиченного site/src/
# и публикуется на GitHub Pages только с master. Свежесть site/src/ сверяет
# калитка (тест site_is_fresh в doc/lib.rs), поэтому здесь только сборка и
# публикация. Actions — только GitHub и закреплены полным хэшем коммита
# (решение 18).
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  pages:
    name: сайт
    runs-on: ubuntu-24.04
    steps:
      - name: Вся история
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: mdBook
        run: |
          cargo install mdbook --locked --version 0.5.4

      - name: Сборка
        run: mdbook build site

      - name: Настройка Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # Включает Pages через API, если она ещё не включена на репозитории.
          enablement: true

      - name: Артефакт
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/book

      - name: Публикация
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
