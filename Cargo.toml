[workspace]
resolver = "2"
members = ["crates/*", "doc", "examples/demo-doc", "examples/demo-product"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.83"
# Лицензия и публичный адрес — решение 17.
license = "Apache-2.0"
repository = "https://github.com/anishukserg/dacc"

[workspace.lints.rust]
# Небезопасный код в крейтах методологии невыразим, а не «проверяется ревью».
unsafe_code = "forbid"
# Нестабильные возможности невыразимы и под RUSTC_BOOTSTRAP шага атак
# (решение 12). На doctest lints манифеста не распространяются — там тот же
# запрет ставит атрибут doc(test(attr(...))) в корне каждого крейта.
unstable_features = "forbid"

[workspace.dependencies]
# Версия у path-зависимостей обязательна публикуемым крейтам (решение 13).
dacc-core = { path = "crates/dacc-core", version = "0.1.1" }
dacc-knowledge = { path = "crates/dacc-knowledge", version = "0.1.1" }
dacc-work = { path = "crates/dacc-work", version = "0.1.1" }
dacc-scan = { path = "crates/dacc-scan", version = "0.1.1" }
dacc-derive = { path = "crates/dacc-derive", version = "0.1.1" }
dacc-journal = { path = "crates/dacc-journal", version = "0.1.1" }
dacc-access = { path = "crates/dacc-access", version = "0.1.1" }
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
chrono = { version = "0.4.32", default-features = false, features = ["std"] }
